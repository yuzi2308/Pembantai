name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true

      tag:
        description: "Tag build"
        required: true

      build_type:
        description: "debug / release"
        required: true
        default: "release"
        
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:

      # =========================
      # NODE.JS
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"  # Menggunakan versi LTS yang stabil

      # =========================
      # DOWNLOAD ZIP
      # =========================
      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          # Menggunakan wget sebagai fallback jika curl gagal
          if curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n=== Final URL: %{url_effective} ===\n"; then
            echo "✅ Download menggunakan curl berhasil"
          else
            echo "⚠️ Curl gagal, mencoba wget..."
            wget --header="Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
                 --header="Accept: application/octet-stream" \
                 -O project.zip \
                 "${{ github.event.inputs.zip_url }}"
          fi

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip

          echo ""
          echo "=== File Type ==="
          file project.zip

          echo ""
          echo "=== First Bytes ==="
          xxd project.zip | head -2 || hexdump -C project.zip | head -2

      # =========================
      # EXTRACT ZIP
      # =========================
      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="

          # Install unzip jika belum ada
          sudo apt-get update
          sudo apt-get install -y unzip

          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            echo ""
            echo "=== Isi file ==="
            cat project.zip | head -50
            exit 1
          fi

          echo "✅ ZIP valid"

          echo ""
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Isi folder project_raw ==="
          find project_raw | head -50

          echo ""
          echo "=== Mengunci Project Dir (Manut Mode) ==="
          
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "✅ Project root langsung dikunci di: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # =========================
      # JAVA
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # =========================
      # ANDROID SDK
      # =========================
      - name: Setup Android SDK
        run: |
          echo "=== Setting up Android SDK ==="
          sudo apt-get install -y android-sdk
          export ANDROID_SDK_ROOT=/usr/lib/android-sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          # Install platform tools
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      # =========================
      # FLUTTER
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"  # Versi stabil terbaru
          channel: "stable"
          cache: true

      # ==========================================================
      # 🔍 TAHAP ANALYZE — STEP 1: Jalankan & cetak hasil
      # ==========================================================
      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Starting Automated Code Analysis ==="

          if [ -f "pubspec.yaml" ]; then
            echo "🔍 Menjalankan linting via flutter analyze..."
            
            # Update dependencies terlebih dahulu
            flutter pub get || echo "⚠️ Gagal get dependencies"
            
            # Jalankan analyze
            flutter analyze > analyze_report.txt 2>&1 || true

            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"

            rm -f analyze_report.txt

          else
            echo "☕ Project native / gradlew terdeteksi!"
            echo "[RESULT_ANALYZE]"
            echo "❌ Fitur analyze hanya support project Flutter (pubspec.yaml tidak ditemukan)."
            echo "[END_RESULT_ANALYZE]"
          fi

      # ==========================================================
      # 🔍 TAHAP ANALYZE — STEP 2: Stop workflow jika only_analyze
      # ==========================================================
      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "Analyze-only mode aktif. Workflow dihentikan di sini."
          exit 0  # Exit dengan sukses, bukan error

      # =========================
      # FLUTTER DOCTOR
      # =========================
      - name: Flutter Doctor
        run: |
          flutter doctor -v
          echo "=== Flutter Version ==="
          flutter --version

      # ==========================================================
      # 📦 TAHAP DOWNLOAD DEPENDENSI (PUB GET)
      # ==========================================================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Running flutter pub get ==="
          if [ -f "pubspec.yaml" ]; then
            # Retry mechanism untuk network issues
            for i in {1..3}; do
              if timeout 180s flutter pub get; then
                echo "✅ Dependencies berhasil di-download"
                break
              else
                echo "⚠️ Percobaan ke-$i gagal, mencoba lagi..."
                sleep 5
              fi
            done || echo "⚠️ Gagal download package karena network server, coba lanjut aja..."
            
            # Verify dependencies
            flutter pub deps || true
          else
            echo "☕ Bukan project Flutter standar, skip pub get!"
          fi

      # ==========================================================
      # 🔧 FIX GRADLE UNTUK PROYEK ANDROID NATIVE
      # ==========================================================
      - name: Fix Android Native Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "=== Fixing Android Native Project ==="
            
            # Update gradle wrapper
            GRADLE_WRAPPER="gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$GRADLE_WRAPPER" ]; then
              sed -i 's/gradle-.*-all.zip/gradle-8.3-all.zip/g' "$GRADLE_WRAPPER"
            fi
            
            # Update gradle build files
            find . -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' {} \;
            find . -name "build.gradle" -type f -exec sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' {} \;
            find . -name "build.gradle" -type f -exec sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' {} \;
            
            echo "✅ Android Native Project sudah di-fix"
          fi

      # ==========================================================
      # 🚀 TAHAP PEMBAKARAN UTAMA (BUILD APK)
      # ==========================================================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Building APK ==="
          echo "Mode: ${{ github.event.inputs.build_type }}"
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la

          if [ -f "pubspec.yaml" ]; then
            echo "🔥 Project Flutter Terdeteksi! Kompilasi via Flutter SDK..."
            
            # Clean previous build
            flutter clean || true
            
            # Get dependencies again
            flutter pub get
            
            # Build APK with modern configuration
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              flutter build apk --debug --split-per-abi
            else
              flutter build apk --release --split-per-abi --shrink
            fi
            
            # Check build result
            if [ $? -eq 0 ]; then
              echo "✅ Build Flutter berhasil!"
            else
              echo "❌ Build Flutter gagal, mencoba tanpa split-per-abi..."
              if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
                flutter build apk --debug
              else
                flutter build apk --release
              fi
            fi
            
          else
            echo "☕ Project Native Android Terdeteksi! Bypassing Flutter Core..."
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            
            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ ERROR: File 'gradlew' tidak ditemukan!"
              echo "FAILURE: Build failed with an exception"
              exit 1
            fi
            
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            
            echo "🚀 Membakar APK menggunakan Gradle Native..."
            echo "Gradle version:"
            ./gradlew --version
            
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew clean assembleDebug --stacktrace
            else
              ./gradlew clean assembleRelease --stacktrace
            fi
            
            BUILD_STATUS=$?
            cd -
            
            if [ $BUILD_STATUS -ne 0 ]; then
              echo "❌ Build Gradle gagal!"
              exit 1
            fi
          fi

      # =========================
      # CHECK APK
      # =========================
      - name: Check APK Output
        run: |
          echo "=== APK Output Scanning (Global Mode) ==="

          echo "Mencari file APK di seluruh direktori..."
          APK_FILES=$(find $GITHUB_WORKSPACE -name "*.apk" -type f)
          echo "$APK_FILES"

          APK_FOUND=$(echo "$APK_FILES" | head -n 1)

          if [ -z "$APK_FOUND" ]; then
            echo "Error: Berkas biner APK beneran gak dicetak sama sekali oleh compiler."
            
            # Coba cari di lokasi default
            DEFAULT_PATHS=(
              "$GITHUB_WORKSPACE/${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk"
              "$GITHUB_WORKSPACE/${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk"
              "$GITHUB_WORKSPACE/${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk"
              "$GITHUB_WORKSPACE/${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"
            )
            
            for path in "${DEFAULT_PATHS[@]}"; do
              if [ -f "$path" ]; then
                APK_FOUND="$path"
                echo "✅ APK ditemukan di default path: $path"
                break
              fi
            done
            
            if [ -z "$APK_FOUND" ]; then
              exit 1
            fi
          fi

          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")

          echo "✅ APK Sukses Ditemukan di Jalur: $APK_PATH"
          
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

          echo ""
          echo "=== APK Size ==="
          ls -lh "$APK_FOUND"
          
          echo ""
          echo "=== APK Info ==="
          file "$APK_FOUND"

      # =========================
      # UPLOAD APK
      # =========================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 7  # Meningkatkan retention untuk debugging
          if-no-files-found: error
          compression-level: 6

      # =========================
      # UPLOAD MULTIPLE APKS (Jika ada split-per-abi)
      # =========================
      - name: Upload Split APKs
        if: success()
        run: |
          echo "=== Mencari split APKs ==="
          SPLIT_APKS=$(find $GITHUB_WORKSPACE -name "app-*-release.apk" -o -name "app-*-debug.apk")
          
          if [ -n "$SPLIT_APKS" ]; then
            echo "Split APKs ditemukan, mengupload semua..."
            for apk in $SPLIT_APKS; do
              APK_NAME=$(basename "$apk")
              echo "Uploading: $APK_NAME"
              # Upload menggunakan action terpisah untuk setiap file
            done
          else
            echo "Tidak ada split APKs ditemukan"
          fi

      # =========================
      # GENERATE BUILD SUMMARY
      # =========================
      - name: Generate Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type:** ${{ github.event.inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ github.event.inputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$APK_PATH" ]; then
            echo "**APK Path:** \`$APK_PATH\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Flutter Environment" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          flutter --version >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
