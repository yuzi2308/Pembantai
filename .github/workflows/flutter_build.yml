name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true

      tag:
        description: "Tag build"
        required: true

      build_type:
        description: "debug / release"
        required: true
        default: "release"

      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:

      # =========================
      # NODE.JS
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # =========================
      # DOWNLOAD ZIP
      # =========================
      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          HTTP_CODE=$(curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "%{http_code}" \
            --silent)

          echo "=== HTTP Status: $HTTP_CODE ==="

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip

          echo ""
          echo "=== File Type ==="
          file project.zip

          echo ""
          echo "=== First Bytes ==="
          xxd project.zip | head -2

      # =========================
      # EXTRACT ZIP
      # =========================
      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="

          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            echo ""
            echo "=== Isi file ==="
            cat project.zip
            exit 1
          fi

          echo "✅ ZIP valid"

          echo ""
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Isi folder project_raw ==="
          find project_raw | head -50

          echo ""
          echo "=== Menentukan Project Dir ==="

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          # Simpan absolute path agar tidak bergantung pada working-directory
          PROJECT_ABS=$(realpath "$PROJECT_DIR")

          echo "✅ Project root dikunci di: $PROJECT_ABS"
          echo "PROJECT_DIR=$PROJECT_ABS" >> $GITHUB_ENV

      # =========================
      # JAVA
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # =========================
      # FLUTTER
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: "stable"
          cache: true

      # ==========================================================
      # 🔍 TAHAP ANALYZE — Jalankan & cetak hasil
      # ==========================================================
      - name: Analyze Project Code
        run: |
          echo "=== Starting Automated Code Analysis ==="

          if [ -f "${{ env.PROJECT_DIR }}/pubspec.yaml" ]; then
            echo "🔍 Menjalankan linting via flutter analyze..."

            cd "${{ env.PROJECT_DIR }}"
            flutter analyze > analyze_report.txt 2>&1 || true

            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"

            rm -f analyze_report.txt
          else
            echo "☕ Project native / gradlew terdeteksi!"
            echo "[RESULT_ANALYZE]"
            echo "❌ Fitur analyze hanya support project Flutter (pubspec.yaml tidak ditemukan)."
            echo "[END_RESULT_ANALYZE]"
          fi

      # ==========================================================
      # 🔍 TAHAP ANALYZE — Stop jika only_analyze=true
      # Menggunakan conclusion 'success' bukan exit 1 agar tidak terlihat FAILED
      # ==========================================================
      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "✅ Analyze-only mode aktif. Workflow selesai di tahap analyze."
          echo "Build APK dilewati sesuai permintaan."

      # =========================
      # FLUTTER DOCTOR
      # =========================
      - name: Flutter Doctor
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: flutter doctor

      # ==========================================================
      # 📦 TAHAP DOWNLOAD DEPENDENSI (PUB GET)
      # ==========================================================
      - name: Get dependencies
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          echo "=== Running flutter pub get ==="
          if [ -f "${{ env.PROJECT_DIR }}/pubspec.yaml" ]; then
            cd "${{ env.PROJECT_DIR }}"
            timeout 180s flutter pub get || echo "⚠️ Gagal download package, coba lanjut..."
          else
            echo "☕ Bukan project Flutter standar, skip pub get!"
          fi

      # ==========================================================
      # 🚀 TAHAP PEMBAKARAN UTAMA (BUILD APK)
      # ==========================================================
      - name: Build APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          echo "=== Building APK ==="
          echo "Mode: ${{ github.event.inputs.build_type }}"

          if [ -f "${{ env.PROJECT_DIR }}/pubspec.yaml" ]; then
            echo "🔥 Project Flutter Terdeteksi! Kompilasi via Flutter SDK..."
            cd "${{ env.PROJECT_DIR }}"
            flutter build apk --${{ github.event.inputs.build_type }}

          else
            echo "☕ Project Native Android Terdeteksi! Bypassing Flutter Core..."
            GRADLE_PATH=$(find "${{ env.PROJECT_DIR }}" -name "gradlew" | head -n 1)

            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ ERROR: File 'gradlew' tidak ditemukan!"
              exit 1
            fi

            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew

            echo "🚀 Membakar APK menggunakan Gradle Native..."
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug
            else
              ./gradlew assembleRelease
            fi
          fi

      # =========================
      # CHECK APK
      # =========================
      - name: Check APK Output
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          echo "=== APK Output Scanning (Global Mode) ==="

          echo "Mencari file APK di seluruh direktori..."
          find $GITHUB_WORKSPACE -name "*.apk" 2>/dev/null

          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" 2>/dev/null | head -n 1)

          if [ -z "$APK_FOUND" ]; then
            echo "❌ Error: APK tidak ditemukan setelah build."
            exit 1
          fi

          echo "✅ APK Sukses Ditemukan di: $APK_FOUND"

          echo ""
          echo "=== APK Size ==="
          ls -lh "$APK_FOUND"

          # Simpan path APK sebagai absolute path (tidak perlu prefix PROJECT_DIR)
          echo "APK_ABSOLUTE=$APK_FOUND" >> $GITHUB_ENV

      # =========================
      # UPLOAD APK
      # =========================
      - name: Upload APK artifact
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_ABSOLUTE }}
          retention-days: 1
          if-no-files-found: error
